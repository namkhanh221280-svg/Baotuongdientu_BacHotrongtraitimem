<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thơ và Bài hát về Bác</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; margin: 0; background: #fff9c4; }
        .header { background: #fbc02d; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 5px solid #d32f2f; }
        .back-btn { text-decoration: none; color: white; font-weight: bold; background: #d32f2f; padding: 8px 20px; border-radius: 20px; margin-left: 10px; }
        .content { max-width: 700px; margin: 20px auto; background: white; padding: 40px; border-radius: 30px; line-height: 2; box-shadow: 0 5px 15px rgba(0,0,0,0.1); box-sizing: border-box; }
        .poem { font-size: 1.2rem; text-align: center; color: #d32f2f; font-style: italic; }
        
        /* Tối ưu hóa khung phát nhạc không bị tràn trên màn hình nhỏ */
        .music-box {
            text-align: center;
            margin: 20px 0;
        }
        .music-box iframe {
            max-width: 100%; /* Tự co giãn theo chiều rộng màn hình điện thoại */
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="back-btn">← Quay lại</a>
        <span style="color: white; font-weight: bold; margin-right: 20px;">Âm nhạc và thơ về Bác Hồ</span>
    </div>
    <div class="content">
        <h2 style="text-align: center; color: #fbc02d;">🎶 Bài hát: Ai yêu Bác Hồ Chí Minh hơn thiếu niên nhi đồng</h2>
        <p style="text-align: center;">(Nhạc và lời: Phong Nhã)</p>
        
        <div class="music-box">
            <img src="images/1540952538974_untitled.png" alt="Bác Hồ với thiếu nhi" style="border-radius: 20px; width: 80%; transition: 0.3s;">
			<audio controls>
                <source src="audio/bacho.mp3" type="audio/mpeg">
                Trình duyệt của bạn không hỗ trợ phát file âm thanh này.
            </audio>
        </div>

        <hr>
        <div class="poem">
            “Bác chúng em dáng cao cao người thanh thanh<br>
            Bác chúng em mắt như sao râu hơi dài<br>
            Bác chúng em nước da nâu vì sương gió<br>
            Bác chúng em thề cương quyết trả thù nhà...”
        </div>
    </div>
</body>
</html>
