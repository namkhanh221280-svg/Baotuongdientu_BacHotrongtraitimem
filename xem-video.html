<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Video làm theo lời Bác</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Quicksand', sans-serif; 
            margin: 0; 
            background: #e1f5fe; 
            text-align: center; 
        }
        .header { 
            background: #0288d1; 
            padding: 15px; 
            border-bottom: 5px solid #fff200; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .back-btn { 
            text-decoration: none; 
            color: white; 
            font-weight: bold; 
            background: rgba(0,0,0,0.2); 
            padding: 8px 20px; 
            border-radius: 20px; 
            margin-left: 10px; 
        }
        .video-container { 
            max-width: 800px; 
            margin: 30px auto; 
            background: white; 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
        }
        
        /* CẬP NHẬT CSS CHO VIDEO GỌN GÀNG, KHÔNG BỊ QUÁ TO */
        video {
            width: 100%;            /* Co giãn linh hoạt theo khung chứa */
            max-width: 950px;       /* Giới hạn độ rộng tối đa vừa mắt */
            max-height: 78vh;       /* Giới hạn chiều cao tối đa không quá 60% màn hình hiển thị */
            border-radius: 15px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background-color: #000; /* Tạo nền đen cho trình phát video */
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="back-btn">← Quay lại</a>
        <span style="color: white; font-weight: bold; margin-right: 20px;">Vodeo Thiếu nhi làm theo lời Bác</span>
    </div>
    
    <div class="video-container">
        <video controls>
            <source src="video/v2.mp4" type="video/mp4">
            Trình duyệt của bạn không hỗ trợ xem video này.
        </video>
        <h3>🌻 "Mỗi việc làm tốt là một đóa hoa thơm gửi tặng Bác Hồ"</h3>
    </div>
</body>
</html>
