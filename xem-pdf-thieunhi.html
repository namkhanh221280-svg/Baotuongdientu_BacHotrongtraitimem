<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bác Hồ Với Thiếu Nhi</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght=400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        body { font-family: 'Quicksand', sans-serif; margin: 0; background-color: #fce4ec; overflow: hidden; }
        .header-bar { 
            background: #ff4081; padding: 15px; text-align: center; 
            border-bottom: 5px solid #fff200; display: flex; justify-content: space-between; align-items: center;
            box-sizing: border-box;
            height: 65px;
        }
        .back-btn {
            text-decoration: none; color: white; font-weight: bold;
            background: rgba(255,255,255,0.3); padding: 8px 20px;
            border-radius: 20px; transition: 0.3s; margin-left: 10px;
        }
        .back-btn:hover { background: white; color: #ff4081; }
        .title { color: white; font-weight: bold; margin-right: 20px; }
        
        .video-container {
            width: 100%;
            height: calc(100vh - 65px);
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Đảm bảo khung phát video luôn full màn hình hình */
        .plyr {
            width: 100%;
            height: 100%;
        }
        video {
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <a href="index.html" class="back-btn">← Quay lại Trang Chủ</a>
        <span class="title">Bác Hồ với thiếu nhi</span>
    </div>
    
    <div class="video-container">
        <video id="player" playsinline controls autoplay>
            <source src="V_muc2_v1.mp4" type="video/mp4" />
        </video>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script>
        // Cấu hình danh sách các video nhỏ của bạn
        const videoPlaylist = [
            "V_muc2_v1.mp4",
            "V_muc2_v2.mp4"
        ];
        
        let currentVideoIndex = 0;
        
        // Kích hoạt trình phát thông minh Plyr
        const player = new Plyr('#player', {
            controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'fullscreen'],
            autoplay: true
        });

        const videoElement = document.getElementById('player');

        // Hàm xử lý chuyển đoạn video mượt mà
        function playNextSegment(index) {
            if (index < videoPlaylist.length) {
                currentVideoIndex = index;
                
                // Thay đổi nguồn cấp video một cách an toàn
                videoElement.src = videoPlaylist[index];
                videoElement.load();
                
                // Lệnh phát video bọc trong hàm bảo mật tránh trình duyệt chặn
                setTimeout(() => {
                    videoElement.play().catch(err => {
                        console.log("Chờ người dùng click tương tác để phát tiếp.");
                    });
                }, 200);
            }
        }

        // Tự động bắt sự kiện khi video chạy hết để nối đoạn tiếp theo
        videoElement.addEventListener('ended', () => {
            currentVideoIndex++;
            if (currentVideoIndex < videoPlaylist.length) {
                playNextSegment(currentVideoIndex);
            } else {
                console.log("Đã phát xong toàn bộ các đoạn video cắt nhỏ.");
            }
        });
    </script>
</body>
</html>
